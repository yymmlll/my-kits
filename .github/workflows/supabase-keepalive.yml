name: Supabase keep-alive

on:
  schedule:
    # 매일 03:00 UTC (한국 시간 낮 12:00)
    - cron: "0 3 * * *"
  # Actions 탭에서 수동으로 실행해 볼 수 있게 함
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (kits 테이블 1건 조회)
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://izqdfsxdvdkoikvzgzcz.supabase.co/rest/v1/kits?select=id&limit=1" \
            -H "apikey: sb_publishable_1B4wSnpourcYGP16olCjaQ_3hKKGofw"
